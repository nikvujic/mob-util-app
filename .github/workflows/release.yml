name: Release

# Builds a signed APK and publishes a GitHub Release with it, either when a
# tag like v0.2.0 is pushed, or on demand (Actions → Release → Run
# workflow), which releases the version in pubspec.yaml on the chosen
# branch and creates its tag. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
              exit 1
            fi
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released; bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (see docs/RELEASING.md)"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test
        run: flutter test

      - name: Set up signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release files
        run: |
          apk="the-app-v${{ steps.version.outputs.version }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "APK signing certificate:"
          keytool -printcert -jarfile "$apk" | grep -E 'Owner|SHA256'
          # Release notes = this version's section of CHANGELOG.md.
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish release, keep only the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run for an existing release: replace the APK and notes.
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            # Creates the tag on this commit when run on demand.
            gh release create "$TAG" "$APK" --title "$TAG" \
              --notes-file release-notes.md --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
          # Older APKs can't be installed over a newer version anyway, so
          # only the latest release is kept. Tags stay as history.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            --repo "$GITHUB_REPOSITORY" | while read -r old; do
            if [ "$old" != "$TAG" ]; then
              gh release delete "$old" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
